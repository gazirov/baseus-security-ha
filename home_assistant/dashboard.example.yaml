# Replace entity IDs with the actual IDs from Settings → Devices & services.
type: vertical-stack
cards:
  - type: picture-entity
    entity: camera.backyard_last_snapshot
    name: Задний двор
    camera_view: auto
    show_state: false
    tap_action:
      action: more-info
  - type: entities
    title: Камера Baseus
    entities:
      - entity: sensor.backyard_battery
        name: Заряд батареи
      - entity: sensor.backyard_last_capture
        name: Последний успешный снимок
      - entity: button.backyard_capture_all_cameras
        name: Снять сейчас
  - type: button
    name: История снимков
    icon: mdi:image-multiple
    tap_action:
      action: navigate
      navigation_path: /media-browser/browser
